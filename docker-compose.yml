services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webscope
      POSTGRES_USER: webscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webscope -d webscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [isolated, egress]
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 --wait >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    # No host port is published. Only the backend can reach clamd on the isolated network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg://webscope:${POSTGRES_PASSWORD}@postgres:5432/webscope
      WEBSCOPE_AUDIT_LOG_PATH: /data/audit-chain.jsonl
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_MAX_BYTES: 25000000
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit_data:/data
    networks: [isolated]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    networks: [isolated]

volumes:
  postgres_data:
  audit_data:
  clamav_data:

networks:
  isolated:
    internal: true
  egress:
    # ClamAV needs outbound access to refresh malware signatures. The API and DB do not.
